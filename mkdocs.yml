site_name: ggnomics
site_description: Composable, ggplot2-style genomics visualization for Python
site_url: https://maximiliannuber.github.io/ggnomics/
repo_url: https://github.com/MaximilianNuber/ggnomics

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

nav:
  - Home: index.md
  - Vignettes (Quarto site): vignettes.md
  - API reference:
      - Reduced dimensions: api/reduced-dimensions.md
      - Expression & metadata: api/expression-metadata.md
      - Abundance & composition: api/abundance-composition.md
      - Heatmaps: api/heatmaps.md
      - QC: api/qc.md
      - Differential expression: api/differential-expression.md
      - Pseudobulk: api/pseudobulk.md
      - UpSet plots: api/upset.md
      - Multimodal: api/multimodal.md
      - Repertoire: api/repertoire.md
      - Statistics & significance: api/statistics-significance.md
      - Palettes: api/palettes.md
      - PCA: api/pca.md
      - Composition helpers: api/composition-helpers.md
      - Legacy API: api/legacy.md
