project:
  type: website
  output-dir: _site

metadata-files:
  - reference/_sidebar.yml

website:
  title: "ggnomics"
  site-url: "https://maximiliannuber.github.io/ggnomics/"
  repo-url: "https://github.com/MaximilianNuber/ggnomics"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: getting-started.qmd
        text: Getting started
      - href: single-cell-scranpy.qmd
        text: Single-cell
      - href: bulk-rnaseq.qmd
        text: Bulk RNA-seq
      - href: upset.qmd
        text: UpSet plots
      - href: multimodal.qmd
        text: Multimodal
      - href: specialized-plots.qmd
        text: Specialized plots
      - href: plot-gallery.qmd
        text: Plot gallery
      - href: reference/index.qmd
        text: API reference
    right:
      - icon: github
        href: https://github.com/MaximilianNuber/ggnomics
        aria-label: "ggnomics on GitHub"

execute:
  # The freeze cache is committed (see .gitignore). It keeps the HTML site and
  # the Sphinx tutorial notebooks in sync from a single execution, and lets CI
  # validate the site with `quarto render --no-execute` without re-fetching
  # every dataset from Bioconductor/BiocPy. Sources that changed still execute.
  freeze: auto
  warning: false
  echo: true

format:
  html:
    theme: cosmo
    toc: true
    code-fold: false
    css:
      - reference/_styles-quartodoc.css

quartodoc:
  package: ggnomics
  dir: reference
  title: "API reference"
  style: pkgdown
  sidebar: reference/_sidebar.yml
  css: reference/_styles-quartodoc.css

  sections:
    - title: "Reduced dimensions"
      contents:
        - plot_embedding
        - plot_reduced_dim
        - plot_umap
        - plot_pca
        - plot_tsne

    - title: "Expression and metadata"
      contents:
        - plot_expression
        - plot_coldata
        - plot_rowdata
        - plot_dot
        - plot_highest_exprs

    - title: "Abundance and composition"
      contents:
        - plot_abundance

    - title: "Heatmaps"
      contents:
        - plot_heatmap

    - title: "Differential expression"
      contents:
        - plot_volcano
        - plot_ma
        - plot_coef_lollipop
        - plot_coef_expression

    - title: "Pseudobulk"
      contents:
        - plot_pseudobulk_qc
        - plot_pseudobulk_de

    - title: "Multimodal"
      contents:
        - plot_bimodal_scatter
        - plot_adt_qc

    - title: "Immune repertoire"
      contents:
        - plot_clonotype_abundance
        - plot_clonotype_overlap
        - plot_clonotype_embedding

    - title: "Statistics"
      contents:
        - plot_violin_stats
        - plot_box_stats
        - geom_signif
        - run_comparisons
