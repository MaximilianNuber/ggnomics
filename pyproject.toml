[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggnomics"
version = "0.1.0"
description = "Modular plotnine-based plotting utilities for single-cell and genomics"
authors = [{ name = "Your Name" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["single-cell", "plotnine", "ggplot", "genomics", "biocpy"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "plotnine>=0.16.0a11,<0.17",
]

[project.optional-dependencies]
anndata = [
  "anndata>=0.10",
]
sce = [
  "singlecellexperiment",
  "biocframe",
]
se = [
  "summarizedexperiment",
  "biocframe",
]
multimodal = ["mudata>=0.2"]
stats = ["scipy>=1.10", "statsmodels>=0.14"]
pca = ["scikit-learn>=1.3", "scipy>=1.10"]
ridge = ["scikit-learn>=1.3"]
pseudobulk = ["scikit-learn>=1.3", "scipy>=1.10"]
upset = [
  "scipy>=1.10",
  "statsmodels>=0.14",
]
umap = ["umap-learn>=0.5"]
repertoire = []
layout = []
all = [
  "anndata>=0.10",
  "singlecellexperiment",
  "summarizedexperiment",
  "biocframe",
  "mudata>=0.2",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "umap-learn>=0.5",
]
dev = [
  "pytest",
  "build",
  "quarto",
]
docs = [
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/yourname/ggnomics"

[tool.setuptools.packages.find]
where = ["."]
include = ["ggnomics*"]
