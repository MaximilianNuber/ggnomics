# Tox configuration for ggnomics.
#
# Local entry points:
#
#   tox -e py          full pytest suite with coverage
#   tox -e core        core-only install; proves optional backends stay lazy
#   tox -e lint        ruff check
#   tox -e format      ruff format --check (never writes)
#   tox -e build       python -m build + twine check
#   tox -e docs        Sphinx site (the published one, BiocPy style)
#   tox -e notebooks   regenerate docs/tutorials/*.ipynb from the Quarto sources
#   tox -e quartosite  quartodoc build + quarto render (the Quarto site)
#   tox -e linkcheck   internal-link validation of the rendered Quarto site
#
# `tox` with no arguments runs: py, core, lint, format, build.
#
# The documentation environments are deliberately NOT in the default list.
# `docs` needs the Sphinx toolchain; `notebooks` and `quartosite` execute the
# vignettes against real public genomics datasets and need network access plus
# scranpy/PyDESeq2/Marsilea.

[tox]
minversion = 4.11
envlist = py, core, lint, format, build
isolated_build = True
# Local machines commonly have only one interpreter. Missing versions are
# skipped rather than failing the whole run; CI pins the real matrix.
skip_missing_interpreters = True

[testenv]
description = Run the full pytest suite with coverage
extras =
    all
    test
setenv =
    MPLBACKEND = Agg
passenv =
    HOME
    CI
commands =
    pytest {posargs:--cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80}

[testenv:core]
description = Core-only install; verifies optional backends are not imported eagerly
extras =
    test
setenv =
    MPLBACKEND = Agg
commands =
    pytest {posargs:tests/test_backends.py tests/test_palettes.py tests/test_upset_api.py -q}

[testenv:lint]
description = Static analysis with Ruff
skip_install = True
deps =
    ruff>=0.14
commands =
    ruff check {posargs:.}

[testenv:format]
description = Verify formatting with Ruff (read-only; never rewrites files)
skip_install = True
deps =
    ruff>=0.14
commands =
    ruff format --check --diff {posargs:.}

[testenv:build]
description = Build sdist + wheel and validate the distribution metadata
skip_install = True
deps =
    build>=1.0
    twine>=5.0
commands =
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build
    python -m twine check dist/*

# ---------------------------------------------------------------------------
# Documentation
#
# ggnomics publishes a Sphinx site in the BiocPy house style (furo, MyST,
# sphinx-apidoc), with the workflow guides included as executed notebooks via
# nbsphinx. The Quarto project in vignettes/ is retained: it is the authoring
# format for those guides and also builds its own site.
#
# The pipeline is:
#
#   vignettes/*.qmd  --(tox -e notebooks)-->  docs/tutorials/*.ipynb
#                    --(tox -e quartosite)-->  vignettes/_site/
#   ggnomics/*.py    --(sphinx-apidoc in docs/conf.py)-->  docs/api/
#                    --(tox -e docs)-->  docs/_build/html/
#
# `docs` never executes a notebook (nbsphinx_execute = "never"): the committed
# notebooks already carry their outputs. It therefore needs no network access
# and no analysis stack, which is what makes the ReadTheDocs build viable.
# ---------------------------------------------------------------------------
[testenv:docs]
description = Build the Sphinx documentation site (does not execute notebooks)
deps =
    -r {toxinidir}/docs/requirements.txt
setenv =
    MPLBACKEND = Agg
passenv =
    HOME
commands =
    sphinx-build --color -b html -d "{toxinidir}/docs/_build/doctrees" "{toxinidir}/docs" "{toxinidir}/docs/_build/html" {posargs}

[testenv:doclinks]
description = Sphinx internal consistency check (nitpick warnings become errors)
deps =
    -r {toxinidir}/docs/requirements.txt
setenv =
    MPLBACKEND = Agg
commands =
    sphinx-build --color -b dummy -d "{toxinidir}/docs/_build/doctrees" "{toxinidir}/docs" "{toxinidir}/docs/_build/dummy" {posargs}

# ---------------------------------------------------------------------------
# Quarto
#
# Both environments below execute the vignettes. QUARTO_PYTHON points Quarto at
# this environment's interpreter; no Jupyter kernel is registered with
# `jupyter kernelspec install`.
#
# griffe is capped below 2.0 in the `quarto` extra: quartodoc 0.11 calls
# griffe's numpy docstring parser with `allow_section_blank_line`, which only
# exists in griffe 1.x. Without the cap, `quartodoc build` fails with
#   TypeError: parse_numpy() got an unexpected keyword argument
#              'allow_section_blank_line'
# ---------------------------------------------------------------------------
[testenv:notebooks]
description = Regenerate docs/tutorials/*.ipynb from the Quarto vignette sources
extras =
    all
    quarto
changedir = {toxinidir}/vignettes
setenv =
    MPLBACKEND = Agg
    QUARTO_PYTHON = {envpython}
passenv =
    HOME
    QUARTO_*
    XDG_*
allowlist_externals =
    quarto
    python
commands =
    python {toxinidir}/tools/build_tutorial_notebooks.py {posargs}

[testenv:quartosite]
description = Generate the quartodoc reference and render the Quarto website
extras =
    all
    quarto
changedir = {toxinidir}/vignettes
setenv =
    MPLBACKEND = Agg
    QUARTO_PYTHON = {envpython}
passenv =
    HOME
    QUARTO_*
    XDG_*
allowlist_externals =
    quarto
commands =
    quartodoc build
    quarto render {posargs}

[testenv:linkcheck]
description = Check internal links in the rendered Quarto site (offline; external URLs skipped)
skip_install = True
deps =
commands =
    python {toxinidir}/tools/check_internal_links.py {posargs:{toxinidir}/vignettes/_site}
