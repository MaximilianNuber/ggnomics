# Tox configuration for ggnomics.
#
# Local entry points:
#
#   tox -e py          full pytest suite with coverage
#   tox -e core        core-only install; proves optional backends stay lazy
#   tox -e lint        ruff check
#   tox -e format      ruff format --check (never writes)
#   tox -e build       python -m build + twine check
#   tox -e docs        build the published great-docs site
#   tox -e linkcheck   internal-link validation of great-docs/_site
#
# `tox` with no arguments runs: py, core, lint, format, build.
#
# The documentation environments are deliberately NOT in the default list.
# `docs` needs Quarto on PATH. Re-executing articles additionally needs the
# analysis/data-access packages documented in CONTRIBUTING.md.

[tox]
minversion = 4.11
envlist = py, core, lint, format, build
isolated_build = True
# Local machines commonly have only one interpreter. Missing versions are
# skipped rather than failing the whole run; CI pins the real matrix.
skip_missing_interpreters = True

[testenv]
description = Run the full pytest suite with coverage
extras =
    all
    test
setenv =
    MPLBACKEND = Agg
passenv =
    HOME
    CI
commands =
    pytest {posargs:--cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80}

[testenv:core]
description = Core-only install; verifies optional backends are not imported eagerly
extras =
    test
setenv =
    MPLBACKEND = Agg
commands =
    pytest {posargs:tests/test_backends.py tests/test_palettes.py tests/test_upset_api.py -q}

[testenv:lint]
description = Static analysis with Ruff
skip_install = True
deps =
    ruff>=0.14
commands =
    ruff check {posargs:.}

[testenv:format]
description = Verify formatting with Ruff (read-only; never rewrites files)
skip_install = True
deps =
    ruff>=0.14
commands =
    ruff format --check --diff {posargs:.}

[testenv:build]
description = Build sdist + wheel and validate the distribution metadata
skip_install = True
deps =
    build>=1.0
    twine>=5.0
commands =
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build
    python -m twine check dist/*

# ---------------------------------------------------------------------------
# Documentation: match .github/workflows/docs.yml (great-docs + Quarto).
# A cached site build does not revalidate the articles' analyses.
# ---------------------------------------------------------------------------
[testenv:docs]
description = Build the published great-docs site (requires Quarto on PATH)
extras =
    all
    docs
setenv =
    MPLBACKEND = Agg
    QUARTO_PYTHON = {envpython}
passenv =
    HOME
    QUARTO_*
    XDG_*
    GGNOMICS_DATA_CACHE
commands =
    great-docs build {posargs}

[testenv:linkcheck]
description = Check internal links in the built great-docs site (offline)
skip_install = True
deps =
commands =
    python {toxinidir}/tools/check_internal_links.py {posargs:{toxinidir}/great-docs/_site}
