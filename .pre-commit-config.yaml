# Pre-commit hooks for ggnomics.
#
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --all-files
#
# Generated great-docs output and the committed Quarto execution cache are
# excluded: reformatting them would be overwritten by the next docs build.
exclude: |
  (?x)^(
    great-docs/.*|
    _freeze/.*|
    docs/img/.*|
    .*\.ipynb
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-added-large-files
        # Rendered vignette figures and the README demonstration plots are
        # legitimately large and are already excluded above; 512 kB is enough
        # headroom for source files without letting datasets slip in.
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
