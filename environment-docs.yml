# Environment for the current great-docs site and optional fresh article runs.
# Install Quarto separately: https://quarto.org/docs/get-started/
#
#   mamba env create -f environment-docs.yml
#   mamba run -n ggnomics-docs python -m pip install -e ".[all,docs]"
#   mamba run -n ggnomics-docs great-docs build
#
# Articles use committed _freeze/ outputs by default. A cached build is not a
# fresh analysis; see CONTRIBUTING.md before updating article code or caches.
name: ggnomics-docs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Core plotting / scientific stack (ggnomics core deps + optional extras)
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib-base>=3.8
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - umap-learn>=0.5

  # Quarto's Jupyter-free-kernel-registration Python execution engine talks to
  # the target interpreter via jupyter_client/nbclient/ipykernel without any
  # `jupyter kernelspec install` step, as long as QUARTO_PYTHON points here.
  - jupyter_client>=8
  - ipykernel>=6
  - nbclient>=0.8
  - nbformat>=5.9
  - pyyaml>=6.0
  - pandoc>=3

  - pip:
      # ggnomics itself is installed editable in a separate step (see Usage above)
      # so that repo edits are picked up without recreating the environment.
      #
      # Exact-pinned: ggnomics.upset needs the 0.16 composition layout API
      # (relative widths/heights, guide handling) that is only available in
      # this alpha release.
      - plotnine==0.16.0a11

      # scverse / AnnData ecosystem
      - anndata>=0.10
      - mudata>=0.2

      # BiocPy containers
      - singlecellexperiment
      - summarizedexperiment
      - biocframe

      # BiocPy public-dataset loaders used by the articles
      - scrnaseq
      - scranpy
      - pyexpressionatlas
      - experimenthub

      # Bulk differential expression
      - pydeseq2

      # Composable heatmaps
      - marsilea

      # Published documentation site (Quarto is a separate system dependency).
      - great-docs
