# Reproducible environment for building the ggnomics documentation.
#
# Covers both builds:
#   * the published Sphinx site (BiocPy style: furo, MyST, sphinx-apidoc,
#     nbsphinx), and
#   * the Quarto project in vignettes/, which authors the tutorials and
#     builds its own site,
# against real public datasets.
#
# Usage:
#   mamba env create -f environment-docs.yml
#   mamba run -n ggnomics-docs python -m pip install -e .
#
# Re-create from scratch after dependency changes:
#   mamba env update -f environment-docs.yml --prune
#
# Verify:
#   mamba run -n ggnomics-docs python -c \
#     "import ggnomics, ggnomics.upset, scrnaseq, scranpy, pyexpressionatlas, experimenthub, pydeseq2, marsilea"
#
# Render docs (see vignettes/README or the top-level README for the full command,
# including how QUARTO_PYTHON is resolved from this environment's prefix):
#   Quarto site:
#     cd vignettes && mamba run -n ggnomics-docs quartodoc build
#     mamba run -n ggnomics-docs env QUARTO_PYTHON="$(mamba run -n ggnomics-docs which python)" \
#       quarto render vignettes
#
#   Tutorial notebooks (executes the vignettes, embeds the figures):
#     mamba run -n ggnomics-docs python tools/build_tutorial_notebooks.py
#
#   Sphinx site (never executes a notebook):
#     mamba run -n ggnomics-docs sphinx-build -b html docs docs/_build/html
name: ggnomics-docs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip

  # Core plotting / scientific stack (ggnomics core deps + optional extras)
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib-base>=3.8
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - umap-learn>=0.5

  # Quarto's Jupyter-free-kernel-registration Python execution engine talks to
  # the target interpreter via jupyter_client/nbclient/ipykernel without any
  # `jupyter kernelspec install` step, as long as QUARTO_PYTHON points here.
  - jupyter_client>=8
  - ipykernel>=6
  - nbclient>=0.8
  - nbformat>=5.9
  - pyyaml>=6.0
  - pandoc>=3

  - pip:
      # ggnomics itself is installed editable in a separate step (see Usage above)
      # so that repo edits are picked up without recreating the environment.
      #
      # Exact-pinned: ggnomics.upset needs the 0.16 composition layout API
      # (relative widths/heights, guide handling) that is only available in
      # this alpha release.
      - plotnine==0.16.0a11

      # scverse / AnnData ecosystem
      - anndata>=0.10
      - mudata>=0.2

      # BiocPy containers
      - singlecellexperiment
      - summarizedexperiment
      - biocframe

      # BiocPy public-dataset loaders used by the vignettes
      - scrnaseq
      - scranpy
      - pyexpressionatlas
      - experimenthub

      # Bulk differential expression
      - pydeseq2

      # Composable heatmaps
      - marsilea

      # Sphinx documentation site (BiocPy house style). nbsphinx also needs
      # pandoc on PATH; install it from conda-forge or your package manager.
      - sphinx>=7.2
      - furo
      - myst-parser[linkify]
      - nbsphinx
      - sphinx-autodoc-typehints
      - sphinx-copybutton

      # quartodoc API reference for the Quarto site.
      # griffe is capped below 2.0: quartodoc 0.11 calls griffe's numpy
      # docstring parser with `allow_section_blank_line`, which only exists
      # in griffe 1.x. Without the cap, `quartodoc build` fails with
      #   TypeError: parse_numpy() got an unexpected keyword argument
      #              'allow_section_blank_line'
      - quartodoc>=0.7
      - griffe>=1.5,<2
