# Read the Docs configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The tutorial notebooks under docs/tutorials/ are committed with their outputs
# (nbsphinx_execute = "never" in docs/conf.py), so this build does not need the
# analysis stack or network access to Bioconductor/BiocPy data services.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      # ReadTheDocs clones shallowly and without tags, so setuptools_scm would
      # fall back instead of resolving the real version. Fetch the full history
      # so docs are labelled with the version they actually document.
      - git fetch --unshallow || true
      - git fetch --tags || true

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

formats:
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
    - path: .
