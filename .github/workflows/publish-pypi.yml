name: Publish to PyPI

# ---------------------------------------------------------------------------
# NOT YET ACTIVE.
#
# This workflow uses PyPI trusted publishing (OIDC) and contains no API token
# or secret of any kind. Before the first release it still needs a trusted
# publisher to be configured on PyPI for the ggnomics project, naming:
#
#   owner:      the final GitHub owner of this repository
#   repository: ggnomics
#   workflow:   publish-pypi.yml
#   environment: pypi
#
# That configuration must wait until the repository's ownership and its final
# location (personal account vs. the BiocPy organisation) are agreed with the
# BiocPy maintainers - a trusted publisher is bound to a specific owner and
# repository, so registering it now against the wrong owner would have to be
# undone. Until then, pushing a version tag will run the build and checks and
# then fail at the publish step, which is the intended safe behaviour.
#
# The `environment: pypi` below also lets a required reviewer be added in the
# repository settings, so that publishing needs a human approval.
# ---------------------------------------------------------------------------

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  release:
    types: [published]

permissions:
  contents: read

env:
  MPLBACKEND: Agg

jobs:
  build:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git tags; the default
          # shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install the package and its test extra
        run: pip install -e ".[all,test]"

      - name: Run the test suite
        run: pytest tests/ -q --tb=short

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the built version is a clean release matching the tag
        if: github.event_name == 'push'
        # setuptools_scm derives the version from the tag, so the two cannot
        # drift the way a hand-maintained `version =` could. What can still go
        # wrong is publishing a *dev* version: if the checkout is shallow, the
        # tag is unannotated, or the tree is dirty, setuptools_scm produces
        # something like 0.1.0.post1.dev1+g1234567 instead of 0.1.0. Those must
        # never reach PyPI, so fail loudly here.
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's|dist/ggnomics-(.*)\.tar\.gz|\1|')"
          echo "tag=$tag built=$built"
          case "$built" in
            *dev*|*+*)
              echo "refusing to publish a development version: $built"
              echo "check that the tag is annotated and the checkout is complete (fetch-depth: 0)"
              exit 1
              ;;
          esac
          if [ "$tag" != "$built" ]; then
            echo "tag $tag does not match the built version $built"
            exit 1
          fi
          echo "OK: publishing $built"

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ggnomics
    permissions:
      # Required for trusted publishing. No PyPI token is stored anywhere.
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
