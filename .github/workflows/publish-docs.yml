name: Publish documentation

# Deploys the Sphinx site to the gh-pages branch. This runs ONLY on a manual
# dispatch or a published release - never on a push - so that documentation is
# not republished by accident while the repository's final home is still being
# agreed with the BiocPy maintainers.
#
# The tutorial notebooks under docs/tutorials/ are committed with their outputs
# and nbsphinx never executes them, so this job needs no network access to the
# genomics data services and no analysis stack.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

env:
  MPLBACKEND: Agg

jobs:
  deploy:
    name: Build and deploy to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from git tags; the default
          # shallow clone has none.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Install the package and the docs extra
        run: pip install -e ".[docs]"

      - name: Build the Sphinx site
        run: sphinx-build --color -b html -d docs/_build/doctrees docs docs/_build/html

      - name: Disable Jekyll processing
        run: touch docs/_build/html/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs/_build/html
          clean: true
