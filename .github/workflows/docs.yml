name: Documentation

# Validates both documentation builds. It does NOT publish: nothing here
# touches the gh-pages branch.
#
#   sphinx  - the published site (BiocPy style: furo, MyST, sphinx-apidoc,
#             nbsphinx). Never executes a notebook, so no network access and no
#             analysis stack is needed.
#   quarto  - the Quarto project in vignettes/, which is the authoring format
#             for the tutorials and also builds its own site. Rendered with
#             --no-execute against the committed freeze cache.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg

jobs:
  sphinx:
    name: Sphinx site (published)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pandoc
        # nbsphinx converts notebook markdown cells with pandoc.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc

      - name: Install the package and the docs extra
        run: pip install -e ".[docs]"

      - name: Confirm the tutorial notebooks carry their outputs
        # docs/conf.py sets nbsphinx_execute = "never", so a notebook committed
        # without outputs would silently render as a figure-less page.
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          missing = []
          for path in sorted(pathlib.Path("docs/tutorials").glob("*.ipynb")):
              nb = json.loads(path.read_text())
              images = sum(
                  1
                  for cell in nb["cells"]
                  for out in cell.get("outputs", [])
                  if "image/png" in out.get("data", {})
              )
              print(f"{path}: {images} embedded figure(s)")
              if images == 0:
                  missing.append(str(path))

          if missing:
              print("\nnotebooks committed without outputs:", *missing, sep="\n  ")
              sys.exit(1)
          PY

      - name: Build the Sphinx site
        run: sphinx-build --color -b html -d docs/_build/doctrees docs docs/_build/html

      - name: Check that the expected pages were produced
        run: |
          set -e
          for page in \
            docs/_build/html/index.html \
            docs/_build/html/readme.html \
            docs/_build/html/tutorials/index.html \
            docs/_build/html/tutorials/getting-started.html \
            docs/_build/html/tutorials/upset.html \
            docs/_build/html/tutorials/plot-gallery.html \
            docs/_build/html/api/modules.html \
            docs/_build/html/api/ggnomics.html
          do
            test -f "$page" || { echo "missing: $page"; exit 1; }
          done
          echo "all expected Sphinx pages rendered"

      - name: Validate internal links in the Sphinx output
        run: python tools/check_internal_links.py docs/_build/html

      - name: Upload the Sphinx site
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-site
          path: docs/_build/html
          if-no-files-found: error
          retention-days: 7

  quarto:
    name: Quarto site (authoring source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install the package with the plotting and quarto extras
        run: pip install -e ".[all,quarto]"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Resolve the interpreter Quarto should use
        # No Jupyter kernel is registered. Quarto talks to this interpreter
        # directly through QUARTO_PYTHON.
        run: echo "QUARTO_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Generate the quartodoc API reference
        working-directory: vignettes
        run: quartodoc build

      - name: Check that the generated reference is complete
        working-directory: vignettes
        run: |
          test -f reference/index.qmd
          test -f reference/_sidebar.yml
          test -f reference/plot_umap.qmd

      - name: Render the Quarto site
        working-directory: vignettes
        # --no-execute uses the committed vignettes/_freeze results. The
        # workflow guides analyse real public datasets via scranpy, PyDESeq2,
        # and the BiocPy data-access packages; re-executing them here would
        # need network access to Bioconductor/BiocPy services and a much
        # heavier environment. The freeze cache keeps this reproducible and
        # keeps the real examples real - it is not a synthetic substitute.
        run: quarto render --no-execute

      - name: Check that the expected pages were produced
        working-directory: vignettes
        run: |
          set -e
          for page in \
            _site/index.html \
            _site/getting-started.html \
            _site/plot-gallery.html \
            _site/bulk-rnaseq.html \
            _site/single-cell-scranpy.html \
            _site/multimodal.html \
            _site/specialized-plots.html \
            _site/upset.html \
            _site/reference/index.html \
            _site/reference/plot_umap.html
          do
            test -f "$page" || { echo "missing: $page"; exit 1; }
          done
          echo "all expected Quarto pages rendered"

      - name: Check that the UpSet vignette is in the navigation
        working-directory: vignettes
        run: grep -q "UpSet plots" _site/index.html

      - name: Validate internal links
        run: python tools/check_internal_links.py vignettes/_site

      - name: Upload the rendered Quarto site
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site
          path: vignettes/_site
          if-no-files-found: error
          retention-days: 7
